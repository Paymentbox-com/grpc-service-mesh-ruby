name: CI

on:
  pull_request:
  push:
    branches: [master]

# Least privilege: the token is read-only. No job here writes to the repo.
permissions:
  contents: read

env:
  PROTOC_VERSION: "36.1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install protoc
        run: |
          name="protoc-${PROTOC_VERSION}-linux-x86_64"
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${name}.zip" -o protoc.zip
          sudo unzip -q -o protoc.zip -d /usr/local
          sudo chmod -R a+rX /usr/local/include/google
          rm protoc.zip
          protoc --version

      - name: Compiled protos match the specification tag
        run: |
          just proto
          git diff --exit-code

      - name: Install gems
        run: bundle install

      - name: Lint
        run: bundle exec rubocop

      - name: Test
        run: bundle exec rspec

      - name: Build gem
        run: gem build grpc_service_mesh.gemspec
